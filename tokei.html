<meta charset="utf-8">
<title>sumi時計</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{ --bg:#ffffff; --fg:#000000; --muted:#595959; --faint:#d4d4d4; --dim:#8c8c8c; --wash:#f4f4f4; --washp:#e0e0e0; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --fg:#ffffff; --muted:#b0b0b0; --faint:#3a3a3a; --dim:#808080; --wash:#141414; --washp:#262626; } }
:root[data-theme="dark"]{ --bg:#000000; --fg:#ffffff; --muted:#b0b0b0; --faint:#3a3a3a; --dim:#808080; --wash:#141414; --washp:#262626; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--bg); height:100%; overflow:hidden; overscroll-behavior:none; }
body{ color:var(--fg); font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; position:fixed; inset:0;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--fg); border-radius:0; padding:8px 12px; cursor:pointer; touch-action:manipulation; }
/* ===== iro/mono 共通タッチ仕様 v1 ここから ===== */
*{ -webkit-tap-highlight-color:transparent; }
button, input, select, [role="button"], [data-act], .tap{ touch-action:manipulation; }
.t3p{ opacity:.6; } /* 押下中(JSが指に追従して付与・統一v1.4.1) */
.overlay:active, .sheet:active, [data-act="noop"]:active{ opacity:1; }
:where(button, [role="button"]).t3p:where(:not(.primary)):where(:not([style*="background"])){ box-shadow:inset 0 0 0 999px var(--washp, var(--wash)); opacity:1; }
@media (prefers-reduced-motion: no-preference){ .t3p{ transition:box-shadow .12s linear; } }
body{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
input, textarea, select, [contenteditable]{
  -webkit-user-select:text !important; user-select:text !important;
  -webkit-touch-callout:default;
}
.selectable, .selectable *{
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
/* ===== iro/mono 共通タッチ仕様 v1 ここまで ===== */
h1, h2, h3, h4{ text-wrap:balance; }
button:focus-visible{ outline:2px solid var(--fg); outline-offset:-2px; }

#app{ height:100%; height:100svh; display:flex; flex-direction:column;
  padding:0 18px calc(6px + env(safe-area-inset-bottom)); padding-top:max(8px, env(safe-area-inset-top));
  padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right)); }

/* ---------- 上の帯 ---------- */
#top{ flex:0 0 auto; display:flex; justify-content:space-between; }
#cdbtn, #setbtn{ border:0; background:var(--bg); color:var(--dim); font-size:11px; padding:6px 2px 10px; font-variant-numeric:tabular-nums; }
#cdbtn{ padding-right:14px; }
#setbtn{ padding-left:14px; }
#cdbtn.on{ color:var(--fg); }

/* ---------- 時計 ---------- */
#mid{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#date{ font-size:16px; color:var(--muted); letter-spacing:.04em; font-variant-numeric:tabular-nums; min-height:24px; }
#big{ font-variant-numeric:tabular-nums; font-weight:500; font-size:min(20.5vw, 26vh, 26svh, 176px); line-height:1.15; letter-spacing:.01em; white-space:nowrap; }
body.fine #big{ font-size:min(19vw, 24vh, 24svh, 162px); }
#bigsub{ font-size:.45em; color:var(--muted); }
#syncline{ border:0; background:none; color:var(--dim); font-size:12px; padding:8px 10px; min-height:36px; font-variant-numeric:tabular-nums; text-align:center; }
body.cdfinal #big{ font-size:min(42vw, 42vh, 42svh); font-weight:600; }
body.cdfinal #date{ color:var(--fg); }
body.cdfinal #syncline{ visibility:hidden; }

/* ---------- 秒読みの帯 ---------- */
#cdbar{ flex:0 0 auto; display:flex; align-items:baseline; gap:10px; border-top:1px solid var(--faint); padding:12px 2px 8px; font-variant-numeric:tabular-nums; }
#cdbar[hidden]{ display:none; }
#cdlbl{ font-size:13px; color:var(--muted); }
#cdrem{ font-size:22px; font-weight:600; margin-left:auto; }
#cdoff{ border:0; background:none; color:var(--dim); font-size:11px; padding:4px 0 4px 14px; }
body.cdfinal #cdbar{ visibility:hidden; }

/* ---------- 合図の一瞬 ---------- */
#flash{ position:fixed; inset:0; background:var(--fg); z-index:60; display:none; }
#flash.on{ display:block; }

/* ---------- シート(かけいぼと同型) ---------- */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
.sheet{ background:var(--bg); border:1px solid var(--fg); width:100%; max-width:480px; max-height:88vh; max-height:88dvh; overflow-y:auto; overscroll-behavior-y:contain; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
.sheet h3{ font-size:13px; font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
.shrow{ display:flex; align-items:baseline; justify-content:space-between; }
.sheet .shx{ border:none; background:none; color:var(--fg); font-size:15px; padding:2px 8px; min-height:0; margin:-2px -6px 0 0; }
section.box{ border:1px solid var(--fg); margin:0 0 14px; background:var(--bg); }
section.box > h2{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.08em; padding:7px 10px; border-bottom:1px solid var(--faint); margin:0; }
.setrow{ padding:12px 10px; border-bottom:1px solid var(--faint); }
.setrow:last-child{ border-bottom:none; }
.setrow .d{ font-size:11px; color:var(--muted); line-height:1.9; margin:0 0 6px; }
.setrow .d:last-child{ margin-bottom:0; }
button.primary{ width:100%; padding:13px 0; font-size:16px; background:var(--fg); color:var(--bg); }
.sbtn{ width:100%; margin-top:8px; font-size:14px; padding:11px 0; }
.setrow .sbtn:first-child{ margin-top:0; }
.help{ font-size:11px; color:var(--dim); margin-top:12px; line-height:1.7; }
.pgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.pgrid button{ padding:12px 0; font-size:16px; font-variant-numeric:tabular-nums; }
.cdrow{ display:flex; gap:8px; }
.cdrow input{ flex:1 1 auto; min-width:0; font:inherit; font-size:18px; color:var(--fg); background:var(--bg); border:1px solid var(--fg); border-radius:0; padding:10px; font-variant-numeric:tabular-nums; -webkit-appearance:none; appearance:none; }
.cdrow .go{ flex:0 0 auto; margin:0; width:auto; padding:0 20px; font-size:15px; }
.syncdetail{ font-size:12px; color:var(--muted); line-height:2; font-variant-numeric:tabular-nums; }
</style>

<div id="app">
  <div id="top">
    <button id="cdbtn" data-act="cdsheet">秒読み</button>
    <button id="setbtn" data-act="sheet">設定</button>
  </div>
  <div id="mid">
    <div id="date"></div>
    <div id="big" aria-hidden="true"><span id="bigmain">--:--:--</span><span id="bigsub"></span></div>
    <button id="syncline" data-act="resync" aria-live="polite"></button>
  </div>
  <div id="cdbar" hidden>
    <span id="cdlbl"></span>
    <span id="cdrem"></span>
    <button id="cdoff" data-act="cdstop">やめる</button>
  </div>
  <div id="ovl"></div>
  <div id="flash"></div>
</div>

<script>
'use strict';

/* ---------- 保存 ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
const LS_KEY = 'tokei-v1';

function sanitize(d){
  const o = { fine:false, snd:false, vib:true, cd:null };
  if(d && typeof d === 'object'){
    o.fine = d.fine === true;
    o.snd = d.snd === true;
    o.vib = d.vib !== false;
    const c = d.cd;
    if(c && typeof c.t === 'number' && /^\d{2}:\d{2}$/.test(String(c.hm || ''))){
      const now = Date.now();
      if(c.t > now - 3600000 && c.t < now + 48 * 3600000) o.cd = { t:c.t, hm:c.hm, resynced:c.resynced === true };
    }
  }
  return o;
}
let data = sanitize((() => { try{ return JSON.parse(lsGet(LS_KEY) || 'null'); }catch(e){ return null; } })());
function save(){ lsSet(LS_KEY, JSON.stringify(data)); }

/* ---------- 日本標準時とあわせる ----------
   3段がまえ: (1) NICTの時刻配信(日本標準時の大元。往復の半分を差し引く)
   (2) timeapi.io(予備) (3) このページの配信元のDateヘッダー(1秒刻みなので区間の交差で絞る)
   どれも届かないときは端末の時計のまま表示し、そのことを隠さない。 */
const NICT = [
  'https://3fe5a5f690efc790d4764f1c528a4ebb89fa4168.nict.go.jp/cgi-bin/json',
  'https://67495dde3b39c2991829589f0101ab7a035eecf5.nict.go.jp/cgi-bin/json',
  'https://08a08e3a6edef4ba7a0c055a42d8e1ba2597f2b5.nict.go.jp/cgi-bin/json',
];
const sync = { ok:false, trying:false, err:false, offset:0, prec:0, rtt:0, server:'', kind:'', at:0, dn0:0, pn0:0 };

function fetchTimeout(url, opts){
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), 4000);
  return fetch(url, Object.assign({ cache:'no-store', signal:ctl.signal }, opts || {})).finally(() => clearTimeout(tm));
}
async function sampleNict(url){
  const it = Date.now();
  const res = await fetchTimeout(url + '?' + (it / 1000));
  if(!res.ok) throw new Error('http ' + res.status);
  const j = await res.json();
  const rt = Date.now();
  if(typeof j.st !== 'number') throw new Error('bad json');
  const rtt = rt - it;
  return { offset: j.st * 1000 - (it + rt) / 2, prec: rtt / 2 + 16, rtt, server: String(j.id || 'nict.go.jp'), kind:'nict' };
}
async function syncViaNict(){
  const rs = await Promise.allSettled(NICT.map(u => sampleNict(u)));
  let best = null;
  for(const r of rs) if(r.status === 'fulfilled' && (!best || r.value.rtt < best.rtt)) best = r.value;
  if(!best) throw new Error('nict down');
  return best;
}
async function syncViaApi(){
  const it = Date.now();
  const res = await fetchTimeout('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Tokyo');
  if(!res.ok) throw new Error('http ' + res.status);
  const j = await res.json();
  const rt = Date.now();
  const st = Date.UTC(j.year, j.month - 1, j.day, j.hour, j.minute, j.seconds, j.milliSeconds) - 32400000;
  if(!isFinite(st)) throw new Error('bad json');
  const rtt = rt - it;
  return { offset: st - (it + rt) / 2, prec: rtt / 2 + 30, rtt, server: 'timeapi.io(予備)', kind:'api' };
}
async function syncViaSelf(){ // Dateヘッダーは秒単位なので、何度か撃って「ありうる範囲」を交差させる
  let lo = -Infinity, hi = Infinity, bestRtt = Infinity, got = 0;
  for(let i = 0; i < 10; i++){
    try{
      const t1 = Date.now();
      const res = await fetchTimeout(location.href, { method:'HEAD' });
      const t4 = Date.now();
      const ds = res.headers.get('date');
      const D = ds ? Date.parse(ds) : NaN;
      if(isFinite(D)){
        const rtt = t4 - t1, mid = (t1 + t4) / 2;
        const l = D - mid - rtt / 2, h = D + 1000 - mid + rtt / 2;
        if(h > lo && l < hi){ lo = Math.max(lo, l); hi = Math.min(hi, h); got++; bestRtt = Math.min(bestRtt, rtt); }
      }
    }catch(e){}
    if(hi - lo < 120) break;
    await new Promise(r => setTimeout(r, 120 + (i * 37) % 80)); // 秒の頭とぶつかり続けないよう不等間隔
  }
  if(got < 3 || !isFinite(lo) || !isFinite(hi) || hi <= lo) throw new Error('no converge');
  return { offset: (lo + hi) / 2, prec: (hi - lo) / 2, rtt: bestRtt, server: 'このページの配信元(Dateヘッダー)', kind:'self' };
}
async function syncNow(){
  if(sync.trying) return;
  sync.trying = true;
  tickStatus(true);
  let got = null;
  for(const fn of [syncViaNict, syncViaApi, syncViaSelf]){
    try{ got = await fn(); break; }catch(e){}
  }
  if(got){
    sync.ok = true; sync.err = false;
    sync.offset = got.offset; sync.prec = got.prec; sync.rtt = got.rtt;
    sync.server = got.server; sync.kind = got.kind;
    sync.at = Date.now(); sync.dn0 = Date.now(); sync.pn0 = performance.now();
    armGong();
  }else{
    sync.err = true;
  }
  sync.trying = false;
  tickStatus(true);
  if(ui.sheet === 'set') renderSheetKeepScroll();
}
function currentJst(){ return Date.now() + (sync.ok ? sync.offset : 0); }

/* ---------- 音の合図(117の時報とおなじ調子: 3・2・1でピッ、ちょうどでポーン) ---------- */
let actx = null;
const scheduled = [];
function audio(){ if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state === 'suspended') actx.resume().catch(() => {}); return actx; }
function tone(when, freq, dur){
  const ctx = audio(); if(!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(.4, when + .005);
  g.gain.setValueAtTime(.4, when + dur - .04);
  g.gain.linearRampToValueAtTime(0, when + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(when); o.stop(when + dur + .01);
  scheduled.push(o);
}
function schedulePips(remMs){ // のこり3.5秒を切ったら、正確な時刻に音を置く(描画のゆらぎと切り離す)
  const ctx = audio(); if(!ctx) return;
  const t0 = ctx.currentTime + remMs / 1000;
  for(const s of [3, 2, 1]) if(remMs - s * 1000 > 20) tone(t0 - s, 440, .1);
  tone(t0, 880, .7);
}
function cancelPips(){ for(const o of scheduled) try{ o.stop(); }catch(e){} scheduled.length = 0; }
function vib(p){ if(data.vib && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }

/* ---------- 秒読み ---------- */
const ui = { sheet:null, phase:'', pipsSet:false, lastVibSec:null, fired:false };
function jstDate(t){ return new Date(t + 32400000); } // getUTC系で読む(端末の時間帯設定に左右されない)
function two(n){ return n < 10 ? '0' + n : '' + n; }
function targetFromHm(hm){
  const now = currentJst();
  const j = jstDate(now);
  const [hh, mm] = hm.split(':').map(Number);
  let t = Date.UTC(j.getUTCFullYear(), j.getUTCMonth(), j.getUTCDate(), hh, mm, 0) - 32400000;
  if(t <= now) t += 86400000;
  return t;
}
function startCd(hm){
  data.cd = { t: targetFromHm(hm), hm, resynced:false };
  save();
  cancelPips(); ui.pipsSet = false; ui.fired = false;
  audio(); // タップのついでに音の準備(あとから「ならす」にしても間に合うように)
  closeSheet();
  render();
  armGong();
  tick();
}
function stopCd(){
  data.cd = null; save();
  cancelPips(); ui.pipsSet = false; ui.fired = false;
  clearTimeout(gongTimer);
  setPhase('');
  render();
  tick();
}
function setPhase(p){
  if(ui.phase === p) return;
  ui.phase = p;
  document.body.classList.toggle('cdfinal', p === 'final');
  if(p === 'final') armGong();
}
let gongTimer = null;
function armGong(){ // 「ちょうど」の合図は描画の間隔に頼らず、その時刻を狙ったタイマーで
  clearTimeout(gongTimer); gongTimer = null;
  if(!data.cd || ui.fired) return;
  const rem = data.cd.t - currentJst();
  if(rem <= 0 || rem > 12000) return;
  gongTimer = setTimeout(() => {
    const r2 = data.cd ? data.cd.t - currentJst() : -1;
    if(r2 > 80){ armGong(); return; } // あわせなおしで時刻が動いたら撃ちなおす
    if(data.cd) fireGong();
  }, rem);
}
function fireGong(){
  if(ui.fired) return;
  ui.fired = true;
  vib([200, 100, 200]);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const f = document.getElementById('flash');
    f.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 500);
  }
}
function fmtRem(ms){ // のこり(切り上げ: 0にならないうちは0と言わない)
  const s = Math.ceil(ms / 1000);
  if(s >= 3600) return Math.floor(s / 3600) + '時間' + two(Math.floor((s % 3600) / 60)) + '分';
  if(s > 60) return Math.floor(s / 60) + '分' + two(s % 60) + '秒';
  return (Math.ceil(ms / 100) / 10).toFixed(1) + '秒';
}
function fmtOver(ms){ // まつ時刻からの経過
  const s = Math.floor(ms / 1000);
  if(s >= 60) return '+' + Math.floor(s / 60) + '分' + two(s % 60) + '秒';
  return '+' + s + '秒';
}

/* ---------- 描画(構えの組み直しはrender、針はtick) ---------- */
const el = {};
for(const id of ['date', 'bigmain', 'bigsub', 'syncline', 'cdbar', 'cdlbl', 'cdrem', 'cdoff', 'cdbtn', 'ovl']) el[id] = document.getElementById(id);
el.sync = el.syncline;
const last = { date:'', bigmain:'', bigsub:'', sync:'', cdlbl:'', cdrem:'', cdoff:'' };
function setText(key, v){ if(last[key] !== v){ last[key] = v; el[key].textContent = v; } }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const YOBI = ['日', '月', '火', '水', '木', '金', '土'];

function render(){
  document.body.classList.toggle('fine', data.fine);
  el.cdbtn.textContent = data.cd ? '秒読み ' + data.cd.hm : '秒読み';
  el.cdbtn.classList.toggle('on', !!data.cd);
  el.cdbar.hidden = !data.cd;
  renderSheet();
  tickStatus(true);
}

function themeMode(){ return lsGet('tokei-theme') || 'auto'; }
function applyThemeMode(){ const m = themeMode(); if(m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', m); }
function cycleThemeMode(){ const cur = themeMode(); lsSet('tokei-theme', cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto'); applyThemeMode(); render(); }
function themeModeLabel(){ return ({ auto:'テーマ: 自動', light:'テーマ: 白', dark:'テーマ: 黒' })[themeMode()]; }

function zureLabel(){
  const off = sync.offset;
  if(Math.abs(off) < 50) return 'ぴったり(0.05秒未満のずれ)';
  return (Math.abs(off) / 1000).toFixed(2) + '秒 ' + (off < 0 ? 'すすんでいる' : 'おくれている');
}
function syncDetailHtml(){
  if(!sync.ok) return '<div class="syncdetail">まだあわせられていません。</div>';
  const ago = Math.max(0, Math.round((Date.now() - sync.at) / 1000));
  const agoS = ago < 60 ? ago + '秒前' : Math.round(ago / 60) + '分前';
  const warn = Math.abs(sync.offset) >= 1000
    ? '<div class="d" style="margin-top:8px">端末の時計が1秒以上ずれています。買う端末では、OSの「日時を自動で設定」が有効かたしかめてください。</div>' : '';
  return '<div class="syncdetail">'
    + 'あわせた先: ' + esc(sync.server) + (sync.kind === 'nict' ? '(日本標準時・NICT)' : '') + '<br>'
    + 'あわせた時刻: ' + agoS + '<br>'
    + '端末の時計: ' + zureLabel() + '<br>'
    + '精度のめやす: ±' + (sync.prec / 1000).toFixed(2) + '秒(通信の往復 ' + Math.round(sync.rtt) + 'ミリ秒)'
    + '</div>' + warn;
}

function renderSheet(){
  if(!ui.sheet){ el.ovl.innerHTML = ''; return; }
  let inner = '';
  if(ui.sheet === 'cd'){
    const act = data.cd
      ? '<section class="box"><h2>いまの秒読み</h2><div class="setrow">'
        + '<div class="d">' + esc(cdDayLabel()) + ' ' + esc(data.cd.hm) + ' <span id="cdlive"></span></div>'
        + '<button class="sbtn" data-act="cdstop">やめる</button></div></section>'
      : '';
    inner = act
      + '<section class="box"><h2>まつ時刻</h2>'
      + '<div class="setrow"><div class="d">よくある時刻からえらぶ(すぎた時刻はあすになります)</div><div class="pgrid">'
      + ['10:00', '11:00', '12:00', '18:00'].map(h => '<button data-act="cdpreset" data-t="' + h + '">' + h + '</button>').join('')
      + '</div></div>'
      + '<div class="setrow"><div class="d">じぶんできめる</div><div class="cdrow">'
      + '<input id="cdtime" type="time" value="' + esc((data.cd && data.cd.hm) || '10:00') + '">'
      + '<button class="go" data-act="cdstart">はじめる</button></div></div>'
      + '</section>'
      + '<section class="box"><h2>合図</h2>'
      + '<div class="setrow"><button class="sbtn" data-act="snd">' + (data.snd ? '音: ならす' : '音: ならさない') + '</button>'
      + '<div class="d">3・2・1 でピッ、ちょうどでポーン(117の時報とおなじ調子)。</div></div>'
      + '<div class="setrow"><button class="sbtn" data-act="vib">' + (data.vib ? 'ふるえ: ふるえる' : 'ふるえ: ふるえない') + '</button>'
      + '<div class="d">Androidのみ。iPhoneはWebの決まりでふるえません。</div></div>'
      + '</section>'
      + '<p class="help">まつ時刻をきめると、のこり時間が下にみえます。さいごの10秒は画面いっぱいに数え、ちょうどの瞬間に一瞬だけ画面が反転します。</p>';
  }else{
    inner = '<section class="box"><h2>表示</h2>'
      + '<div class="setrow"><button class="sbtn" data-act="theme">' + themeModeLabel() + '</button></div>'
      + '<div class="setrow"><button class="sbtn" data-act="fine">' + (data.fine ? '0.1秒: みせる' : '0.1秒: みせない') + '</button>'
      + '<div class="d">秒のつぎのケタまで表示します。</div></div>'
      + '</section>'
      + '<section class="box"><h2>同期</h2>'
      + '<div class="setrow">' + syncDetailHtml() + '<button class="sbtn" data-act="resync">いますぐあわせる</button></div>'
      + '</section>'
      + '<section class="box"><h2>つかいかた</h2><div class="setrow"><div class="d">'
      + 'この時計は、日本標準時をつくっている NICT(情報通信研究機構)の時刻配信にあわせて動きます。ひらいたとき・ときどき・秒読みの直前に、自動であわせなおします。<br>'
      + 'チケットの発売など、時刻ぴったりをまつときは左上の「秒読み」。まつ時刻をきめると、のこり時間がみえます。<br>'
      + 'この画面をひらいているあいだ、画面は消灯しません(消えてしまう端末では、自動ロックを長めにしてください)。'
      + '</div></div></section>'
      + '<section class="box"><h2>調子が悪いとき</h2><div class="setrow">'
      + '<div class="d">時刻があやしいときは、上の「いますぐあわせる」。それでも合わないときは、通信(VPN・フィルタリング)をたしかめてから、さいよみこみしてください。</div>'
      + '<button class="sbtn" data-act="reload">さいよみこみ</button></div></section>';
  }
  el.ovl.innerHTML = '<div class="overlay" data-act="close"><div class="sheet" data-act="noop">'
    + '<div class="shrow"><h3>' + (ui.sheet === 'cd' ? '秒読み' : 'せってい') + '</h3><button class="shx" data-act="close" aria-label="とじる">✕</button></div>'
    + inner + '</div></div>';
}
function cdDayLabel(){
  if(!data.cd) return '';
  const now = jstDate(currentJst()), tg = jstDate(data.cd.t);
  return now.getUTCDate() === tg.getUTCDate() ? 'きょう' : 'あす';
}
function openSheet(s){ ui.sheet = s; renderSheet(); }
function closeSheet(){ ui.sheet = null; renderSheet(); }
function renderSheetKeepScroll(){ // シート内トグルで組み直してもスクロール位置を保つ
  const sh = el.ovl.querySelector('.sheet');
  const top = sh ? sh.scrollTop : 0;
  renderSheet();
  const sh2 = el.ovl.querySelector('.sheet');
  if(sh2) sh2.scrollTop = top;
}

/* ---------- 状態の行(時計の下) ---------- */
function tickStatus(force){
  let s;
  if(sync.trying && !sync.ok) s = '日本標準時にあわせている…';
  else if(sync.err && !sync.ok) s = 'あわせられない ・ 端末の時計で表示中(タップでやりなおす)';
  else if(!sync.ok) s = '';
  else{
    const head = sync.kind === 'nict' ? '日本標準時' : '時刻あわせ済み';
    s = head + '(±' + (sync.prec / 1000).toFixed(2) + '秒) ・ 端末は' + (Math.abs(sync.offset) < 50 ? 'ぴったり' : ' ' + (Math.abs(sync.offset) / 1000).toFixed(1) + '秒 ' + (sync.offset < 0 ? 'すすんでいる' : 'おくれている'));
  }
  if(force) last.sync = '';
  setText('sync', s);
}

/* ---------- 針(秒の頭を狙って更新する。setInterval(1000)は秒境界からずれていくので使わない) ---------- */
let tickTimer = null, lastSecCheck = 0;
function tick(){
  clearTimeout(tickTimer);
  const t = currentJst();
  const j = jstDate(t);
  const hh = two(j.getUTCHours()), mm = two(j.getUTCMinutes()), ss = two(j.getUTCSeconds());
  const timeStr = hh + ':' + mm + ':' + ss;

  let phase = '', rem = 0;
  if(data.cd){
    rem = data.cd.t - t;
    if(rem > 10500) phase = 'wait';
    else if(rem > 0) phase = 'final';
    else if(rem > -600000) phase = 'after';
    else{ stopCd(); return; }
  }
  setPhase(phase);

  if(phase === 'final'){
    setText('date', timeStr + (data.fine ? '.' + Math.floor(j.getUTCMilliseconds() / 100) : ''));
    setText('bigmain', String(Math.floor(rem / 1000)));
    setText('bigsub', '.' + Math.floor((rem % 1000) / 100));
  }else{
    setText('date', (j.getUTCMonth() + 1) + '月' + j.getUTCDate() + '日(' + YOBI[j.getUTCDay()] + ')');
    setText('bigmain', timeStr);
    setText('bigsub', data.fine ? '.' + Math.floor(j.getUTCMilliseconds() / 100) : '');
  }

  if(data.cd){
    if(phase === 'wait'){
      setText('cdlbl', cdDayLabel() + ' ' + data.cd.hm + ' まで');
      setText('cdrem', 'あと ' + fmtRem(rem));
      setText('cdoff', 'やめる');
    }else if(phase === 'after'){
      setText('cdlbl', data.cd.hm + ' から');
      setText('cdrem', fmtOver(-rem));
      setText('cdoff', 'おわる');
    }
    const live = document.getElementById('cdlive');
    if(live) live.textContent = rem >= 0 ? 'まで あと ' + fmtRem(rem) : 'から ' + fmtOver(-rem);

    if(phase === 'final'){
      if(data.snd && !ui.pipsSet && rem <= 3500){ ui.pipsSet = true; schedulePips(rem); }
      const ws = Math.ceil(rem / 1000);
      if(ws <= 3 && ws >= 1 && ws !== ui.lastVibSec){ ui.lastVibSec = ws; vib(40); }
    }
    if((phase === 'wait' || phase === 'final') && rem <= 75000 && !data.cd.resynced){
      data.cd.resynced = true; save();
      if(Date.now() - sync.at > 90000) syncNow(); // 肝心の直前にいちばん新しい同期で臨む
    }
    if(phase === 'after' && !ui.fired) fireGong();
  }

  const nowMs = Date.now();
  if(nowMs - lastSecCheck > 1000){
    lastSecCheck = nowMs;
    tickStatus();
    if(sync.ok){
      // 端末の時計が動かされた・端末が眠っていた形跡があれば、あわせなおす
      const drift = (Date.now() - sync.dn0) - (performance.now() - sync.pn0);
      if(Math.abs(drift) > 500){ sync.dn0 = Date.now(); sync.pn0 = performance.now(); syncNow(); }
      else if(document.visibilityState === 'visible' && nowMs - sync.at > 20 * 60000) syncNow();
    }
  }

  // つぎの更新: 0.1秒表示中と秒読みの残り61秒以内は0.1秒の頭、ふだんは秒の頭
  const fine10 = data.fine || (data.cd && rem > 0 && rem <= 61000);
  const step = fine10 ? 100 : 1000;
  const t2 = currentJst();
  tickTimer = setTimeout(tick, Math.max(15, step - (((t2 % step) + step) % step) + 2));
}

/* ---------- 入力 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.getAttribute('data-act');
  if(act === 'noop') return;
  else if(act === 'cdsheet') openSheet('cd');
  else if(act === 'sheet') openSheet('set');
  else if(act === 'close') closeSheet();
  else if(act === 'resync'){ audio(); syncNow(); }
  else if(act === 'theme') cycleThemeMode();
  else if(act === 'fine'){ data.fine = !data.fine; save(); document.body.classList.toggle('fine', data.fine); renderSheetKeepScroll(); tick(); }
  else if(act === 'snd'){ data.snd = !data.snd; save(); if(data.snd) audio(); renderSheetKeepScroll(); }
  else if(act === 'vib'){ data.vib = !data.vib; save(); if(data.vib) vib(30); renderSheetKeepScroll(); }
  else if(act === 'cdpreset') startCd(b.getAttribute('data-t'));
  else if(act === 'cdstart'){
    const v = (document.getElementById('cdtime') || {}).value;
    if(/^\d{2}:\d{2}/.test(v || '')) startCd(v.slice(0, 5));
  }
  else if(act === 'cdstop') stopCd();
  else if(act === 'reload') location.reload();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.sheet) closeSheet();
});

/* ---------- 画面を消灯させない ---------- */
let wl = null;
async function keepAwake(){
  try{ if('wakeLock' in navigator && document.visibilityState === 'visible') wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    keepAwake();
    sync.dn0 = Date.now(); sync.pn0 = performance.now(); // 眠っていたぶんを「動かされた」あつかいしない
    if(sync.ok && Date.now() - sync.at > 60000) syncNow();
    tick(); // もどった瞬間に古い時刻を見せない
  }
});

/* ---------- 起動 ---------- */
if(data.cd && data.cd.t <= Date.now()) ui.fired = true; // すぎた秒読みをひらきなおしても合図はならさない
applyThemeMode();
render();
keepAwake();
syncNow();
tick();
if(/[?&]cd\b/.test(location.search)) openSheet('cd'); // ホーム画面アイコン長押しの近道「秒読み」

/* ===== 押下ハイライトの完全追従(統一v1.5.1) ===== */
(function(){
  const SKIP = '.overlay, .sheet, [data-act="noop"]';
  const HITSEL = 'button, [role="button"], [data-act], .tap';
  let pel = null, downEl = null, tracking = false;
  const setP = el2 => { if(pel === el2) return; if(pel) pel.classList.remove('t3p'); pel = el2; if(pel) pel.classList.add('t3p'); };
  const hit = (x, y) => {
    const n = document.elementFromPoint(x, y);
    const b = n && n.closest ? n.closest(HITSEL) : null;
    return (b && !b.matches(SKIP)) ? b : null;
  };
  const down = t => {
    setP(null); tracking = false; downEl = null;
    const b = t && t.closest ? t.closest(HITSEL) : null;
    if(!b || b.matches(SKIP)) return;
    tracking = true; downEl = b; setP(b);
  };
  const move = (x, y) => { if(tracking) setP(hit(x, y)); };
  const up = () => {
    if(!tracking) return;
    const target = pel, origin = downEl;
    setP(null); tracking = false; downEl = null;
    if(target && target !== origin){ try{ target.click(); }catch(err){} }
  };
  const cancel = () => { setP(null); tracking = false; downEl = null; };
  document.addEventListener('pointerdown', e => { if(e.isPrimary) down(e.target); }, { passive: true, capture: true });
  document.addEventListener('pointermove', e => { if(e.isPrimary) move(e.clientX, e.clientY); }, { passive: true, capture: true });
  document.addEventListener('pointerup', e => { if(e.isPrimary) up(); }, { passive: true, capture: true });
  document.addEventListener('pointercancel', cancel, { passive: true, capture: true });
  document.addEventListener('touchstart', e => { if(!tracking) down(e.target); }, { passive: true, capture: true });
  document.addEventListener('touchmove', e => { const c = e.touches && e.touches[0]; if(c) move(c.clientX, c.clientY); }, { passive: true, capture: true });
  document.addEventListener('touchend', up, { passive: true, capture: true });
  document.addEventListener('touchcancel', cancel, { passive: true, capture: true });
  window.addEventListener('blur', cancel);
})();
</script>
